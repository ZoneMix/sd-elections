<!doctype html>
<!-- Link preview card for elections.zonemix.tech (public/og.png, 1200x630).
     Rendered with a headless browser at 1200x630, device scale 1:
       open this file, screenshot the viewport, save as public/og.png.
     zonemix.tech Almanac palette (paper, ink, rust) and Bricolage Grotesque. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&display=block" rel="stylesheet" />
<style>
  :root { --bg: #f4f0e8; --line: #ddd5c6; --fg: #1d1a16; --muted: #5e574c; --accent: #a4432a; --rep: #d9473c; --dem: #1a4580; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: var(--bg); color: var(--fg); font-family: "Bricolage Grotesque", sans-serif; }
  body { padding: 64px 80px; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: baseline; font-size: 28px; }
  .mark { font-weight: 650; letter-spacing: -0.01em; }
  .date { color: var(--muted); }
  h1 { margin-top: 84px; font-size: 148px; line-height: 0.9; font-weight: 680; letter-spacing: -0.045em; font-stretch: 86%; }
  .sub { margin-top: 30px; font-size: 38px; line-height: 1.25; color: var(--muted); max-width: 900px; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 28px; padding-top: 26px; border-top: 2px solid var(--line); font-size: 26px; color: var(--muted); }
  .badge { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 7px; color: #fff; font-weight: 700; font-size: 22px; }
  .pair { display: inline-flex; align-items: center; gap: 10px; color: var(--fg); }
  .url { margin-left: auto; color: var(--accent); font-weight: 560; }
</style>
</head>
<body>
  <div class="top"><span class="mark">zonemix</span><span class="date">November 3, 2026</span></div>
  <h1>South Dakota votes</h1>
  <p class="sub">General election results, county by county, and a ZIP code lookup for what’s on your ballot.</p>
  <div class="foot">
    <span class="pair"><span class="badge" style="background: var(--rep)">R</span>Republican</span>
    <span class="pair"><span class="badge" style="background: var(--dem)">D</span>Democratic</span>
    <span class="url">elections.zonemix.tech</span>
  </div>
</body>
</html>
